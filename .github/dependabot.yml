version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      frontend:
        patterns: ['*']
        update-types: ['minor', 'patch']
      frontend-major:
        patterns: ['*']
        update-types: ['major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']
      actions-major:
        patterns: ['*']
        update-types: ['major']
